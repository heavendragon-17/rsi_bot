[project]
name = "rsi-bot"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "integration: requires external services",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__pycache__/*",
    # True CLI entry-point scripts — all logic delegated to library code.
    "app/backtest/backtest.py",
    "app/backtest/benchmark.py",
    "app/backtest/runners/tick_replay.py",
    "app/backtest/runners/batch_runner.py",
    "app/backtest/runners/portfolio_runner.py",
    "app/backtest/runners/portfolio_sweep.py",
    "app/backtest/runners/__init__.py",
    "app/backtest/statistics/analyzer.py",
    "app/backtest/statistics/__init__.py",
    "app/backtest/statistics/visualize.py",
    "app/backtest/reporting/__init__.py",
    "app/backtest/reporting/styles.py",
    "app/backtest/data/download.py",
    "app/backtest/data/download_tick.py",
    "app/api/export_schema.py",
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "app.trading.exchange.binance_adapter",
    "app.trading.exchange.hyperliquid_adapter",
    "app.trading.exchange.lighter_adapter",
    "app.trading.exchange.lighter_queries",
    "app.trading.exchange.factory",
    "app.trading.runner",
    "app.trading.strategy.rsi_wma_retest",
    "app.trading.strategy.rsi_momentum.strategy",
    "app.trading.strategy.loader",
    "app.api.routes.presets",
    "app.backtest.engine",
    "app.backtest.runners.tick_replay",
    "app.backtest.runners.portfolio_runner",
    "app.backtest.runners.batch_runner",
    "app.backtest.service",
    "app.repository.backtest.models",
]
ignore_errors = true

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B104", "B107", "B106", "B110"]
