[project]
name = "rsi-bot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "integration: requires external services",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__pycache__/*",
    # CLI entry-point scripts — orchestration only, tested manually.
    "app/backtest/backtest.py",
    "app/backtest/benchmark.py",
    "app/backtest/runners/tick_replay.py",
    "app/backtest/runners/batch_runner.py",
    "app/backtest/runners/portfolio_runner.py",
    "app/backtest/runners/portfolio_sweep.py",
    "app/backtest/runners/progress.py",
    "app/backtest/runners/__init__.py",
    "app/backtest/statistics/analyzer.py",
    "app/backtest/statistics/visualize.py",
    "app/backtest/statistics/__init__.py",
    "app/backtest/reporting/__init__.py",
    "app/backtest/reporting/styles.py",
    "app/backtest/data/download.py",
    "app/backtest/data/download_tick.py",
    "app/backtest/engine/portfolio_engine.py",
    "app/backtest/engine/portfolio_event_source.py",
    "app/backtest/workers.py",
    "app/backtest/config_builder.py",
    "app/backtest/batch_aggregation.py",
    "app/backtest/engine/jit_functions.py",
    "app/api/export_schema.py",
    "app/api/routes/trade_chart.py",
    # Network / SDK wrappers — require live services or heavy mocking.
    "app/trading/exchange/binance_adapter.py",
    "app/trading/exchange/lighter_adapter.py",
    "app/trading/exchange/lighter_queries.py",
    "app/trading/exchange/hyperliquid_adapter.py",
    "app/trading/exchange/sim/sim_funding.py",
    "app/trading/exchange/sim/sim_stream.py",
    "app/data/stream_manager.py",
    "app/notification/telegram_notifier.py",
    "app/notification/telegram_bot.py",
    "app/notification/command_handlers.py",
    "app/notification/deploy_commands.py",
    "app/notification/notification_service.py",
    # Runtime entry points — wire threads/signals together.
    "app/trading/runner.py",
    "app/trading/runner_loop.py",
    "app/trading/status_writer.py",
    "app/main.py",
    # DB setup / ORM glue — thin SQLAlchemy wiring.
    "app/repository/db_connect.py",
    "app/repository/order_repo.py",
    "app/repository/backtest/seed.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "app.trading.exchange.binance_adapter",
    "app.trading.exchange.hyperliquid_adapter",
    "app.trading.exchange.lighter_adapter",
    "app.trading.exchange.lighter_queries",
    "app.trading.exchange.factory",
    "app.trading.runner",
    "app.trading.strategy.rsi_wma_retest",
    "app.trading.strategy.rsi_momentum",
    "app.trading.strategy.loader",
    "app.api.routes.presets",
    "app.backtest.engine",
    "app.backtest.runners.tick_replay",
    "app.backtest.runners.portfolio_runner",
    "app.backtest.runners.batch_runner",
    "app.backtest.service",
    "app.repository.backtest.models",
]
ignore_errors = true

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B104", "B107", "B106", "B110"]
