name: CI

on:
  push:
    branches: [mua-tren-the-nang]
  pull_request:
    branches: [mua-tren-the-nang]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  arch-lint:
    name: Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run architecture lint
        run: python scripts/arch_lint.py
      - name: Post violation summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('python scripts/arch_lint.py 2>&1 || true').toString();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Architecture Lint Failed\n\n\`\`\`\n${output}\n\`\`\``
            });

  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check app/ tests/ scripts/
      - name: Post ruff summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('ruff check app/ tests/ scripts/ 2>&1 || true').toString();
            const truncated = output.substring(0, 3000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Ruff Lint Failed\n\n\`\`\`\n${truncated}\n\`\`\``
            });

  tests:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml
      - name: Post coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            // Get coverage summary from terminal output
            const output = execSync(
              'pytest tests/ --cov=app --cov-report=term --cov-config=pyproject.toml -q --no-header 2>&1 || true'
            ).toString();
            // Extract the coverage table (last lines before the total)
            const lines = output.split('\n');
            const coverageLines = lines.filter(l => l.includes('TOTAL') || l.includes('%'));
            const totalLine = lines.find(l => l.includes('TOTAL'));
            const summary = totalLine || 'Coverage data not available';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Test Coverage Report\n\n\`\`\`\n${summary}\n\`\`\`\n\nFull report available in CI artifacts.`
            });

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt mypy
      - name: Run mypy
        run: mypy app/ --ignore-missing-imports
      - name: Post mypy summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('mypy app/ --ignore-missing-imports 2>&1 || true').toString();
            const truncated = output.substring(0, 3000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## mypy Type Check Failed\n\n\`\`\`\n${truncated}\n\`\`\``
            });

  bandit:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit[toml]
      - name: Run bandit
        run: bandit -r app/ -c pyproject.toml
      - name: Post bandit summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('bandit -r app/ -c pyproject.toml 2>&1 || true').toString();
            const truncated = output.substring(0, 3000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Bandit Security Scan Failed\n\n\`\`\`\n${truncated}\n\`\`\``
            });

  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  detect-secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install detect-secrets
      - name: Audit secrets baseline
        run: detect-secrets audit --report .secrets.baseline

  circular-imports:
    name: Circular Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check circular imports
        run: |
          python -c "
          from app.core import interfaces, actions, config, constants, events, snapshots
          from app.data import indicators, store
          print('No circular imports detected')
          "

  doc-freshness:
    name: Doc Freshness Reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check and remind
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.ref;
            const appChanged = execSync(`git diff --name-only origin/${base}...HEAD -- 'app/' | wc -l`).toString().trim();
            const docsChanged = execSync(`git diff --name-only origin/${base}...HEAD -- 'docs/' | wc -l`).toString().trim();
            if (parseInt(appChanged) > 0 && parseInt(docsChanged) === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## Documentation Reminder\n\nCode changed in `app/` but no docs updated. See `docs/INDEX.md` for routing.\n\n> Reminder only — not blocking.'
              });
            }
