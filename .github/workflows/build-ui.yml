name: Build UI bundle

# Rebuilds ui/build/ whenever UI source or deps change and commits it back.
# This keeps the no-Node one-click launcher (run_backtest_ui.bat) working from a fresh clone.
#
# Note: requires "Read and write permissions" under Settings -> Actions -> General -> Workflow permissions.
# Without that, the push step at the end will fail with 403.

on:
  push:
    branches: [mua-tren-the-nang]
    paths:
      - "ui/src/**"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/vite.config.ts"
      - "ui/tsconfig*.json"
      - "ui/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and commit UI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI bundle
        working-directory: ui
        run: npm run build

      - name: Commit rebuilt bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/build
          if git diff --staged --quiet; then
            echo "Bundle already up to date - nothing to commit."
            exit 0
          fi
          git commit -m "chore(ui): rebuild bundle [skip ci]"
          git push
