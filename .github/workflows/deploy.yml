name: Deploy

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  deployments: write

jobs:
  # ── Resolve which tag we are deploying ─────────────────────────
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

  # ── Reuse full CI suite on the tagged commit ─────────────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write

  # ── Promote to production branch ─────────────────────────────────
  promote:
    name: Promote to Production
    needs: [ci, resolve-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward production to tagged commit
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          echo "Deploying tag ${{ needs.resolve-tag.outputs.tag }} (SHA: $TAG_SHA)"
          git fetch origin production 2>/dev/null || true
          git checkout -B production "$TAG_SHA"
          git push origin production --force

      - name: Create GitHub deployment
        uses: actions/github-script@v7
        env:
          DEPLOY_TAG: ${{ needs.resolve-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.DEPLOY_TAG;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: tag,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Promote ${tag} to production`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: `${tag} pushed to production. VPS will pick up within 1 min.`
            });
