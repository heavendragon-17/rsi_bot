name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

jobs:
  # ── Re-run full CI on the tagged commit ──────────────────────────
  arch-lint:
    name: Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/arch_lint.py

  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check app/ tests/ scripts/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --tb=short

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt mypy
      - run: mypy app/ --ignore-missing-imports

  bandit:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit[toml]
      - run: bandit -r app/ -c pyproject.toml

  circular-imports:
    name: Circular Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -c "
          from app.core import interfaces, actions, config, constants, events, snapshots
          from app.data import indicators, store
          print('No circular imports detected')
          "

  # ── Promote to production branch ─────────────────────────────────
  promote:
    name: Promote to Production
    needs: [arch-lint, ruff, tests, mypy, bandit, circular-imports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward production to tagged commit
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          git fetch origin production 2>/dev/null || true
          git checkout -B production "$TAG_SHA"
          git push origin production --force-with-lease

      - name: Create GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: tag,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Promote ${tag} to production`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: `${tag} pushed to production. VPS will pick up within 1 min.`
            });
