name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

jobs:
  # ── Re-run full CI on the tagged commit ──────────────────────────
  arch-lint:
    name: Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/arch_lint.py

  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check app/ tests/ scripts/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --tb=short

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt mypy
      - run: mypy app/ --ignore-missing-imports

  bandit:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit[toml]
      - run: bandit -r app/ -c pyproject.toml

  circular-imports:
    name: Circular Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -c "
          from app.core import interfaces, actions, config, constants, events, snapshots
          from app.data import indicators, store
          print('No circular imports detected')
          "

  # ── Promote to production branch ─────────────────────────────────
  promote:
    name: Promote to Production
    needs: [arch-lint, ruff, tests, mypy, bandit, circular-imports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward production to tagged commit
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          # Create production branch if it doesn't exist
          git fetch origin production 2>/dev/null || true
          git checkout -B production "$TAG_SHA"
          git push origin production --force-with-lease

  # ── Notify via Telegram + GitHub deployment status ───────────────
  notify:
    name: Send Deploy Trigger
    needs: [promote]
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag info
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ steps.tag.outputs.tag }}',
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploy ${{ steps.tag.outputs.tag }}'
            });
            return deployment.data.id;

      - name: Send Telegram deploy trigger
        env:
          DEPLOY_TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          DEPLOY_TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="${{ steps.tag.outputs.sha }}"
          # Get the tag annotation or commit message
          MESSAGE=$(git log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || echo "Release $TAG")
          PAYLOAD="DEPLOY:${TAG}:${SHA}:${MESSAGE}"

          curl -s -X POST \
            "https://api.telegram.org/bot${DEPLOY_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${DEPLOY_TELEGRAM_CHAT_ID}" \
            -d text="${PAYLOAD}" \
            --fail

      - name: Set deployment status to success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Deploy trigger sent for ${{ steps.tag.outputs.tag }}'
            });

      - name: Set deployment status to failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deploy trigger failed for ${{ steps.tag.outputs.tag }}'
            });
