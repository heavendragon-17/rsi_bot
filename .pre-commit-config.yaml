repos:
  # ── Ruff (lint + format) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Standard file hygiene ─────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  # ── Secret detection ──────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # ── Architecture lint (local custom hook) ─────────────────
  - repo: local
    hooks:
      - id: arch-lint
        name: Architecture lint
        entry: python scripts/arch_lint.py
        language: system
        pass_filenames: false
        files: ^app/.*\.py$
        stages: [pre-commit]

  # ── Type checking ────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: []
        files: ^app/
        pass_filenames: false
        entry: mypy app/

  # ── Security scan ────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, app/, -c, pyproject.toml]
        pass_filenames: false
        files: ^app/.*\.py$

  # ── Circular import check + Tests (local hooks) ──────────
  - repo: local
    hooks:
      - id: circular-imports
        name: Circular import check
        entry: python -c "from app.core import interfaces, actions, config, constants, events, snapshots; from app.data import indicators, store; print('No circular imports detected')"
        language: system
        pass_filenames: false
        files: ^app/.*\.py$
        stages: [pre-commit]

      - id: pytest
        name: Run tests
        entry: pytest tests/ -x -q --tb=short --no-header
        language: system
        pass_filenames: false
        files: \.(py)$
        stages: [pre-commit]
