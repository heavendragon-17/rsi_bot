bot:
    active: true
    mode: 'paper' # paper or live
    timeframe: '15m'

exchange:
    name: 'binance' # binance or hyperliquid

timeframe: '15m'
symbols:
    - 'BTC/USDT'
    - 'ETH/USDT'
    - 'BNB/USDT'
    - 'XPL/USDT'
    - 'RIVER/USDT'

# Strategy selection
# Available: "rsi_wma_retest", "rsi_no_retest"
strategy: 'rsi_no_retest'

# Optional: Override strategy default parameters
# These will be merged with the strategy's DEFAULT_CONFIG
# strategy_params:
#   rsi_period: 14
#   wma_retest_distance: 0.5

risk:
    # Position sizing
    max_position_size_pct: 0.99 # Max margin to use per trade (99% of balance)
    risk_per_trade_pct: 0.02 # Risk 2% of capital per trade
    use_risk_based_sizing: true # Calculate size based on SL distance
    use_initial_capital_for_risk: true # Risk based on initial capital (not current balance)
    min_sl_distance_pct: 0.003 # Minimum SL distance (1%) - skip trades with smaller SL

    # Futures leverage
    leverage: 10 # 10x leverage for futures

    # TP percentages
    tp1_close_pct: 0.33 # Close 1/3 at TP1
    tp2_close_pct: 0.50 # Close 1/2 of remaining at TP2

backtest:
    initial_balance: 10000
    fees:
        enabled: true        # Toggle fees on/off
        maker_rate: 0.0000   # 0.02% maker fee (LIMIT orders like SL/TP)
        taker_rate: 0.00025   # 0.04% taker fee (MARKET orders)
