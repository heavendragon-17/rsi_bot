bot:
  active: true
  mode: "signal" # mock | sim | paper | live | signal — see docs/07_trading_strategies/signal-bot.md for signal mode
  debug: true # Toggle verbose strategy logging

exchange:
  name: "binanceusdm" # binanceusdm | lighter | hyperliquid | etc.

timeframe: "15m"
symbols:
  - "PYTH/USDT"
  - "XLM/USDT"
  - "BERA/USDT"
  - "AXS/USDT"
  - "ETH/USDT"
  - "ARB/USDT"
  - "MINA/USDT"
  - "TRX/USDT"
  - "API3/USDT"
  - "ETHFI/USDT"
  - "WIF/USDT"
  - "HBAR/USDT"
  - "FET/USDT"
  - "STX/USDT"
  - "OP/USDT"
  - "TON/USDT"
  - "ETC/USDT"
  - "OG/USDT"

# Strategy selection
# Available: "rsi_wma_retest", "rsi_no_retest"
strategy: "rsi_no_retest"

risk:
  # Position sizing
  max_position_size_pct: 10 # Max margin to use per trade (99% of balance)
  risk_per_trade_pct: 0.002 # Risk 2% of capital per trade
  use_risk_based_sizing: true # Calculate size based on SL distance
  use_initial_capital_for_risk: true # Risk based on initial capital (not current balance)
  min_sl_distance_pct: 0.003 # Minimum SL distance (1%) - skip trades with smaller SL

  # Futures leverage
  leverage: 10 # 10x leverage for futures

  # TP percentages
  tp1_close_pct: 1 # Close 1/3 at TP1
  tp2_close_pct: 0 # Close 1/2 of remaining at TP2

backtest:
  initial_balance: 100000
  duration:
    days: 0
    months: 5
    years: 0

sim:
  initial_balance: 10000 # USDT starting balance for sim mode
  telegram_token: "" # leave blank to reuse TELEGRAM_BOT_TOKEN
  chat_id: "" # leave blank to reuse TELEGRAM_CHAT_ID; set to a channel/group ID to send sim msgs separately
  tick_sample_interval_ms: 500 # aggTrade sampling interval (ms)

# =====================================================================
# Signal-bot mode (bot.mode: "signal").
# =====================================================================
# The signal bot runs N strategies concurrently and posts entry/exit
# advice to per-strategy Telegram topics in a single supergroup. It does
# NOT place orders. See docs/07_trading_strategies/signal-bot.md for the
# full spec. Replace group_id / topic_ids with your supergroup's values.

telegram:
  group_id: -1003329642656 # supergroup with topics enabled
  debug_topic_id: 1006 # receives expiry + failure + warn messages

strategies:
  - name: rsi_no_retest
    active: true
    telegram_topic_id: 1003
  - name: rsi_wma_retest
    active: false
    telegram_topic_id: 43
    timeframe: "1h" # override the global 15m
    symbols: ["BTC/USDT"] # override the global symbols list
    risk:
      tp1_close_pct: 0.5 # merges into the global risk block
  - name: rsi_momentum
    active: false
    telegram_topic_id: 44

virtual_positions:
  max_age_candles: 50 # auto-expire after N candles with no SL/TP hit

signal_runner:
  max_consecutive_failures: 3 # per-symbol retry budget before thread dies

data:
  max_candles_per_timeframe:
    "1m": 6000
    "5m": 6000
    "15m": 6000
    "1h": 3000
    "4h": 1500
    "1d": 500
